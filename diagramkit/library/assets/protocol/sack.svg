<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 144 112" width="144" height="112" role="img" aria-labelledby="title desc" font-family="Arial, Helvetica, sans-serif">
  <title id="title">Selective acknowledgement</title>
  <desc id="desc">Use human-readable received / missing state. A gap is not proof of loss; distinguish a delayed packet from a confirmed illustrative drop. Feedback travels receiver to sender.</desc>
  <g id="artwork" stroke-linecap="round" stroke-linejoin="round"><rect x="25" y="15" width="94" height="82" rx="6" fill="#F0EBFC" stroke="#132B50" stroke-width="2.5"/><line x1="25" y1="37" x2="119" y2="37" stroke="#7855C5" stroke-width="1.5" stroke-linecap="round"/><line x1="25" y1="56" x2="119" y2="56" stroke="#7855C5" stroke-width="1.5" stroke-linecap="round"/><line x1="25" y1="75" x2="119" y2="75" stroke="#7855C5" stroke-width="1.5" stroke-linecap="round"/><line x1="55" y1="37" x2="55" y2="97" stroke="#7855C5" stroke-width="1.5" stroke-linecap="round"/><line x1="87" y1="37" x2="87" y2="97" stroke="#7855C5" stroke-width="1.5" stroke-linecap="round"/><rect x="28" y="40" width="24" height="13" rx="1" fill="#7855C5" stroke="#7855C5" stroke-width="2.5"/><rect x="90" y="40" width="25" height="13" rx="1" fill="#7855C5" stroke="#7855C5" stroke-width="2.5"/><rect x="58" y="59" width="26" height="13" rx="1" fill="#7855C5" stroke="#7855C5" stroke-width="2.5"/><rect x="52.6" y="84" width="38.8" height="20" rx="5" fill="#FFFFFF" stroke="#7855C5" stroke-width="1.6"/><text x="72" y="98" text-anchor="middle" font-size="9.5" font-weight="700" fill="#7855C5">SACK</text></g>
</svg>
