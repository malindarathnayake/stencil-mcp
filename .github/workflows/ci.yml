name: CI

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Test (${{ matrix.os }}, Python ${{ matrix.python }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        python: ["3.10", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - name: Unit tests
        run: python -m unittest discover -s tests -v
      - name: Generated files match a rebuild
        # Release metadata (build_release.py) is excluded: it records timestamps.
        # PNG previews need CairoSVG and are not regenerated here.
        shell: bash
        run: |
          python scripts/build_library.py
          python scripts/build_schema.py
          python scripts/build_templates.py
          python scripts/build_gallery.py
          if [ -n "$(git status --porcelain)" ]; then
            echo "::error::A rebuild changed committed files. Run the build scripts and commit the result."
            git status --porcelain
            git diff --stat
            exit 1
          fi

  package:
    name: Build and smoke-test wheel
    runs-on: ubuntu-latest
    needs: test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Tag matches package version
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          version=$(python -c "import tomllib;print(tomllib.load(open('pyproject.toml','rb'))['project']['version'])")
          if [ "v$version" != "$GITHUB_REF_NAME" ]; then
            echo "::error::Tag $GITHUB_REF_NAME does not match pyproject version $version"
            exit 1
          fi
      - name: Build wheel and sdist
        run: |
          python -m pip install --disable-pip-version-check build
          python -m build
      - name: Smoke-test wheel in a clean environment
        run: python scripts/smoke_wheel.py dist/*.whl
      - uses: actions/upload-artifact@v4
        with:
          name: dist
          path: |
            dist/
            MANIFEST.sha256
          if-no-files-found: error

  release:
    name: Publish GitHub Release
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    needs: package
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: dist
          path: release
      - name: Create release with wheel, sdist and manifest
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          (cd release/dist && sha256sum * > ../SHA256SUMS)
          gh release create "$GITHUB_REF_NAME" release/dist/* release/MANIFEST.sha256 release/SHA256SUMS \
            --title "Stencil $GITHUB_REF_NAME" --generate-notes --verify-tag
