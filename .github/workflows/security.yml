# Static analysis, secret scanning, workflow auditing and dependency scanning.
# Runs on every push and PR, and weekly so new advisories surface without a commit.
#
# Scanner binaries are downloaded at an exact version and verified against a SHA-256
# before they run; third-party scanner *actions* are not used. In March 2026 attackers
# force-pushed 76 of 77 aquasecurity/trivy-action tags and shipped a malicious Trivy
# v0.69.4 (GHSA-69fq-xp46-6x23). A pinned binary with a checked digest cannot be
# re-pointed. Bumps are manual: change version and checksum together, taking both from
# the release's checksums file and GitHub's asset digest (docs/SECURITY_POSTURE.md).
name: Security

on:
  push:
    branches: [main]
  pull_request:
  schedule:
    # Off the hour: ":00" crons queue behind everyone else's and get load-shed.
    - cron: "17 5 * * 1"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: security-${{ github.ref }}
  cancel-in-progress: true

jobs:
  codeql:
    name: CodeQL (Python, security-extended)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
      security-events: write  # upload CodeQL results to code scanning
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # security-extended over the default suite: this is an MCP server that parses
      # model-supplied input and writes files; we would rather triage more findings.
      - uses: github/codeql-action/init@2892aa5e19bbd11bc0cff5427e3b750a04d9e3c2 # v4.38.2
        with:
          languages: python, actions
          queries: security-extended
      - uses: github/codeql-action/analyze@2892aa5e19bbd11bc0cff5427e3b750a04d9e3c2 # v4.38.2

  gitleaks:
    name: Secret scan (gitleaks)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      # Full history: a secret removed in a later commit is still in the repo.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Download gitleaks (pinned binary)
        run: |
          curl -fsSL -o gitleaks.tar.gz https://github.com/gitleaks/gitleaks/releases/download/v8.30.1/gitleaks_8.30.1_linux_x64.tar.gz
          echo "551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb  gitleaks.tar.gz" | sha256sum -c -
          tar -xzf gitleaks.tar.gz gitleaks
      # PRs scan the PR's commit range; push and cron scan all history.
      - name: "Scan (PR: diff-scoped, otherwise: full history)"
        env:
          EVENT: ${{ github.event_name }}
          BASE: ${{ github.event.pull_request.base.sha }}
          HEAD: ${{ github.event.pull_request.head.sha }}
        run: |
          if [ "$EVENT" = "pull_request" ]; then
            ./gitleaks detect --source . --config .gitleaks.toml --redact --log-opts "$BASE..$HEAD"
          else
            ./gitleaks detect --source . --config .gitleaks.toml --redact
          fi

  zizmor:
    name: Workflow audit (zizmor)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Download zizmor (pinned binary)
        run: |
          curl -fsSL -o zizmor.tar.gz https://github.com/zizmorcore/zizmor/releases/download/v1.30.1/zizmor-x86_64-unknown-linux-gnu.tar.gz
          echo "e65324f4430c2717591937edcec90ccbefaf14c174f8ec9415e03ca875b46e1a  zizmor.tar.gz" | sha256sum -c -
          tar -xzf zizmor.tar.gz zizmor
      # Online audits use the read-only token to check, among other things, that every
      # pinned SHA really belongs to the action's repository (impostor commits).
      - name: Audit workflows
        env:
          GH_TOKEN: ${{ github.token }}
        run: ./zizmor --persona=pedantic .github/workflows

  dependencies:
    name: SBOM and vulnerability scan (Syft + Grype)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
      - name: Download Syft and Grype (pinned binaries)
        run: |
          curl -fsSL -o syft.tar.gz https://github.com/anchore/syft/releases/download/v1.52.0/syft_1.52.0_linux_amd64.tar.gz
          curl -fsSL -o grype.tar.gz https://github.com/anchore/grype/releases/download/v0.119.0/grype_0.119.0_linux_amd64.tar.gz
          printf '%s\n' \
            "caeedb81fb0491615f1ebd1761e4145d41ee86dd2cc7bf80669f9f5ad9d6133d  syft.tar.gz" \
            "3fa2dc4b924621ab65404cf08d0b8438d896d80ab949c9d5a4ca283c36004c9b  grype.tar.gz" | sha256sum -c -
          tar -xzf syft.tar.gz syft
          tar -xzf grype.tar.gz grype
      # Two surfaces: what ships (the wheel installed into a clean venv) and what
      # builds it (the hash-locked toolchain in requirements-build.txt). Grype's vulnerability
      # database is fetched at run time; it is data, not code, and Grype checks its checksum.
      # --target rather than a venv, so pip itself does not appear in the shipped SBOM.
      - name: Build the locked wheel and install it into an empty directory
        run: |
          python -m pip install --disable-pip-version-check --require-hashes --only-binary=:all: -r requirements-build.txt
          python -m build --no-isolation --wheel --outdir dist
          python -m pip install --disable-pip-version-check --no-deps --target shipped dist/*.whl
      - name: Generate SBOMs
        run: |
          ./syft scan dir:shipped -o cyclonedx-json=sbom-wheel.cdx.json
          ./syft scan file:requirements-build.txt -o cyclonedx-json=sbom-build.cdx.json
      - name: Scan SBOMs (fail on high or critical)
        run: |
          ./grype sbom:sbom-wheel.cdx.json --fail-on high
          ./grype sbom:sbom-build.cdx.json --fail-on high
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: always()
        with:
          name: sbom
          path: sbom-*.cdx.json
          retention-days: 30
