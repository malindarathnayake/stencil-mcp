version: 2
updates:
  # The required pair of the SHA pins in .github/workflows: pins without an updater
  # rot, an updater without pins is mutable-tag roulette. The cooldown keeps a
  # just-published (possibly hijacked) action release out of the queue until it has
  # been public for a week; majors still arrive ungrouped for individual review.
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    cooldown:
      default-days: 7
      semver-major-days: 14
    open-pull-requests-limit: 5
    groups:
      minor-and-patch:
        update-types: ["minor", "patch"]
    commit-message:
      prefix: "chore(ci)"

  # Hash-locked build toolchain (requirements-build.txt). Dependabot rewrites the
  # --hash lines with the version. The runtime itself has no dependencies.
  - package-ecosystem: pip
    directory: /
    schedule:
      interval: weekly
    cooldown:
      default-days: 14
    open-pull-requests-limit: 5
    groups:
      build-toolchain:
        patterns: ["*"]
    commit-message:
      prefix: "chore(deps)"
