<svg xmlns="http://www.w3.org/2000/svg" width="2458" height="1214" viewBox="0 0 2458 1214" role="img" aria-labelledby="diagram-title" aria-describedby="diagram-description" font-family="Arial, Helvetica, sans-serif">
<title id="diagram-title">Engineering: from pull request to production</title>
<desc id="diagram-description">Developer opens a pull request. Reviewer approves or requests changes, which return to the developer. Approved changes are built, tested and scanned by CI/CD. The platform team approves the release and deploys it; a failed health check rolls back to the previous release.</desc>
<rect x="0" y="0" width="2458" height="1214" rx="0" fill="#FFFFFF" stroke="none" stroke-width="1.5"/>
<defs>
<marker id="arrow-blue" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse" markerUnits="userSpaceOnUse"><path d="M1 1 L9 5 L1 9 Z" fill="#1875D1"/></marker>
