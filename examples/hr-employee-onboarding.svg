<text x="36" y="52" font-size="34" fill="#132B50" font-weight="700" text-anchor="start">HR: employee onboarding</text>
<text x="36" y="85" font-size="16" fill="#5B708B" font-weight="400" text-anchor="start">From an accepted offer to a 30-day check-in, with HR, the hiring manager and IT preparing in parallel.</text>
