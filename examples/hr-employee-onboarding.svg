<svg xmlns="http://www.w3.org/2000/svg" width="2698" height="1214" viewBox="0 0 2698 1214" role="img" aria-labelledby="diagram-title" aria-describedby="diagram-description" font-family="Arial, Helvetica, sans-serif">
<title id="diagram-title">HR: employee onboarding</title>
<desc id="diagram-description">The new hire accepts the offer. HR sends the contract, the new hire signs it, and HR creates the personnel record. HR, the hiring manager and IT then prepare in parallel: orientation, a buddy, and accounts with a laptop. When all three are ready the new hire starts. After 30 days the manager holds a check-in and onboarding is complete.</desc>
<rect x="0" y="0" width="2698" height="1214" rx="0" fill="#FFFFFF" stroke="none" stroke-width="1.5"/>
