<text x="36" y="52" font-size="34" fill="#132B50" font-weight="700" text-anchor="start">An agent with controlled tool access</text>
<text x="36" y="85" font-size="16" fill="#5B708B" font-weight="400" text-anchor="start">Read-only data access and privileged actions have different tools, policies and approval paths.</text>
