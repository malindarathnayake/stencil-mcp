<text x="36" y="52" font-size="34" fill="#132B50" font-weight="700" text-anchor="start">IT: new-hire access provisioning</text>
<text x="36" y="85" font-size="16" fill="#5B708B" font-weight="400" text-anchor="start">From an HR-system ticket to a verified first login, with an extra approval for privileged roles.</text>
