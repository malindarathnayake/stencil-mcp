<svg xmlns="http://www.w3.org/2000/svg" width="2458" height="1214" viewBox="0 0 2458 1214" role="img" aria-labelledby="diagram-title" aria-describedby="diagram-description" font-family="Arial, Helvetica, sans-serif">
<title id="diagram-title">IT: new-hire access provisioning</title>
<desc id="diagram-description">The HR system opens an onboarding ticket. The service desk validates it and returns incomplete requests. The identity admin creates the account and assigns role groups while the service desk provisions a laptop. Privileged roles need a time-bound approval from Security. The new hire enrols MFA and the service desk verifies the first login.</desc>
