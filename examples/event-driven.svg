<text x="36" y="52" font-size="34" fill="#132B50" font-weight="700" text-anchor="start">Event-driven processing</text>
<text x="36" y="85" font-size="16" fill="#5B708B" font-weight="400" text-anchor="start">One published event can feed independent consumers. Delivery guarantees are application-specific.</text>
