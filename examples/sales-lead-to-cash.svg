<text x="36" y="52" font-size="34" fill="#132B50" font-weight="700" text-anchor="start">Sales: lead to cash</text>
<text x="36" y="85" font-size="16" fill="#5B708B" font-weight="400" text-anchor="start">An inbound enquiry is qualified, quoted and negotiated; a won deal becomes an order, an invoice and recognised revenue.</text>
