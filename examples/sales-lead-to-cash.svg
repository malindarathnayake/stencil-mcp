<svg xmlns="http://www.w3.org/2000/svg" width="2698" height="1214" viewBox="0 0 2698 1214" role="img" aria-labelledby="diagram-title" aria-describedby="diagram-description" font-family="Arial, Helvetica, sans-serif">
<title id="diagram-title">Sales: lead to cash</title>
<desc id="diagram-description">A customer enquiry reaches Sales, who qualify it; unqualified leads are closed. Sales sends a quote and negotiates with the customer. A lost deal is closed; a won deal becomes an order in sales operations. Finance invoices the customer, receives payment and reports the revenue.</desc>
<rect x="0" y="0" width="2698" height="1214" rx="0" fill="#FFFFFF" stroke="none" stroke-width="1.5"/>
