<svg xmlns="http://www.w3.org/2000/svg" width="1580" height="718" viewBox="0 0 1580 718" role="img" aria-labelledby="diagram-title" aria-describedby="diagram-description" font-family="Arial, Helvetica, sans-serif">
<title id="diagram-title">Threat-model data flows</title>
<desc id="diagram-description">Track which data crosses each trust boundary and which component is responsible for checking it.</desc>
<rect x="0" y="0" width="1580" height="718" rx="0" fill="#FFFFFF" stroke="none" stroke-width="1.5"/>
<defs>
<marker id="arrow-blue" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse" markerUnits="userSpaceOnUse"><path d="M1 1 L9 5 L1 9 Z" fill="#1875D1"/></marker>
<marker id="arrow-teal" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse" markerUnits="userSpaceOnUse"><path d="M1 1 L9 5 L1 9 Z" fill="#13857B"/></marker>
<marker id="arrow-purple" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse" markerUnits="userSpaceOnUse"><path d="M1 1 L9 5 L1 9 Z" fill="#7855C5"/></marker>
<marker id="arrow-orange" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse" markerUnits="userSpaceOnUse"><path d="M1 1 L9 5 L1 9 Z" fill="#CC7628"/></marker>
<marker id="arrow-red" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse" markerUnits="userSpaceOnUse"><path d="M1 1 L9 5 L1 9 Z" fill="#C44552"/></marker>
<marker id="arrow-slate" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse" markerUnits="userSpaceOnUse"><path d="M1 1 L9 5 L1 9 Z" fill="#526C8C"/></marker>
<marker id="arrow-green" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse" markerUnits="userSpaceOnUse"><path d="M1 1 L9 5 L1 9 Z" fill="#368454"/></marker>
<marker id="arrow-yellow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse" markerUnits="userSpaceOnUse"><path d="M1 1 L9 5 L1 9 Z" fill="#AD8215"/></marker>
</defs>
<text x="36" y="52" font-size="34" fill="#132B50" font-weight="700" text-anchor="start">Threat-model data flows</text>
<text x="36" y="85" font-size="16" fill="#5B708B" font-weight="400" text-anchor="start">Track which data crosses each trust boundary and which component is responsible for checking it.</text>
<g id="group-browser-zone">
<rect x="36" y="150" width="311" height="455" rx="12" fill="#EDF2F7" stroke="#526C8C" stroke-width="1.4" stroke-dasharray="7 5"/>
<text x="55" y="181" font-size="20" fill="#132B50" font-weight="700" text-anchor="start">User-controlled context</text>
</g>
<g id="group-app-zone">
<rect x="423" y="150" width="1116" height="455" rx="12" fill="#EAF3FE" stroke="#1875D1" stroke-width="1.4" stroke-dasharray="7 5"/>
<text x="442" y="181" font-size="20" fill="#132B50" font-weight="700" text-anchor="start">Application trust boundary</text>
</g>
<path id="edge-e1" data-kind="data" d="M288 366 L492 366" fill="none" stroke="#1875D1" stroke-width="2.4" stroke-linejoin="round" stroke-linecap="round" marker-end="url(#arrow-blue)"/>
<path id="edge-e2" data-kind="data" d="M729 366 L880 366" fill="none" stroke="#C44552" stroke-width="2.4" stroke-linejoin="round" stroke-linecap="round" marker-end="url(#arrow-red)"/>
<path id="edge-e3" data-kind="data" d="M1117 366 L1255 366" fill="none" stroke="#CC7628" stroke-width="2.4" stroke-linejoin="round" stroke-linecap="round" marker-end="url(#arrow-orange)"/>
<g id="node-actor" data-kind="component"><title>External actor</title><rect x="96" y="292" width="192" height="148" rx="10" fill="#FFFFFF" stroke="#CAD8E8" stroke-width="1.5"/><rect x="96" y="292" width="4" height="148" rx="2" fill="#1875D1" stroke="none" stroke-width="1.5"/><g transform="translate(149 302.056) scale(0.597222)"><g stroke-linecap="round" stroke-linejoin="round"><circle cx="72" cy="31" r="18" fill="#F0EBFC" stroke="#132B50" stroke-width="2.5" /><path d="M36 96 V81 Q37 57 72 57 Q107 57 108 81 V96 Z" fill="#F0EBFC" stroke="#132B50" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" /></g>
</g><text x="192" y="386" font-size="17" fill="#132B50" font-weight="700" text-anchor="middle">External actor</text></g>
<g id="node-api" data-kind="component"><title>Request handler</title><rect x="492" y="292" width="237" height="148" rx="10" fill="#FFFFFF" stroke="#CAD8E8" stroke-width="1.5"/><rect x="492" y="292" width="4" height="148" rx="2" fill="#1875D1" stroke="none" stroke-width="1.5"/><g transform="translate(567.5 302.056) scale(0.597222)"><g stroke-linecap="round" stroke-linejoin="round"><rect x="23" y="23" width="98" height="66" rx="8" fill="#EDF2F7" stroke="#132B50" stroke-width="2.5" /></g>
</g><text x="610.5" y="386" font-size="17" fill="#132B50" font-weight="700" text-anchor="middle">Request handler</text><text x="610.5" y="404" font-size="12" fill="#5B708B" font-weight="400" text-anchor="middle">Process: validate / authorize</text></g>
<g id="node-policy" data-kind="component"><title>Policy decision</title><rect x="880" y="292" width="237" height="148" rx="10" fill="#FFFFFF" stroke="#CAD8E8" stroke-width="1.5"/><rect x="880" y="292" width="4" height="148" rx="2" fill="#C44552" stroke="none" stroke-width="1.5"/><g transform="translate(955.5 302.056) scale(0.597222)"><g stroke-linecap="round" stroke-linejoin="round"><path d="M72 9 L129 56 L72 103 L15 56 Z" fill="#FCECEF" stroke="#132B50" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" /><text x="72" y="67" text-anchor="middle" font-size="31" font-weight="700" fill="#C44552">?</text><rect x="45.9" y="84" width="52.2" height="20" rx="5" fill="#FFFFFF" stroke="#C44552" stroke-width="1.6" /><text x="72" y="98" text-anchor="middle" font-size="9.5" font-weight="700" fill="#C44552">POLICY</text></g>
</g><text x="998.5" y="386" font-size="17" fill="#132B50" font-weight="700" text-anchor="middle">Policy decision</text><text x="998.5" y="404" font-size="12" fill="#5B708B" font-weight="400" text-anchor="middle">Context and authorization</text></g>
<g id="node-store" data-kind="component"><title>Sensitive store</title><rect x="1255" y="292" width="237" height="148" rx="10" fill="#FFFFFF" stroke="#CAD8E8" stroke-width="1.5"/><rect x="1255" y="292" width="4" height="148" rx="2" fill="#CC7628" stroke="none" stroke-width="1.5"/><g transform="translate(1330.5 302.056) scale(0.597222)"><g stroke-linecap="round" stroke-linejoin="round"><line x1="25" y1="27" x2="119" y2="27" stroke="#526C8C" stroke-width="3" stroke-linecap="round" /><line x1="25" y1="85" x2="119" y2="85" stroke="#526C8C" stroke-width="3" stroke-linecap="round" /><line x1="25" y1="27" x2="25" y2="85" stroke="#526C8C" stroke-width="3" stroke-linecap="round" /></g>
</g><text x="1373.5" y="386" font-size="17" fill="#132B50" font-weight="700" text-anchor="middle">Sensitive store</text><text x="1373.5" y="404" font-size="12" fill="#5B708B" font-weight="400" text-anchor="middle">Data classification applies</text></g>
<g id="node-dfd-note" data-kind="text"><title>For every crossing: identify the data, caller identity, validation, authorization, logging and failure behavior. Boundaries do not enforce policy by themselves.</title><text x="482" y="525" font-size="16" fill="#132B50" font-weight="400" text-anchor="start">For every crossing: identify the data, caller identity, validation, authorization, logging and failure behavior. Boundaries do not</text><text x="482" y="546.12" font-size="16" fill="#132B50" font-weight="400" text-anchor="start">enforce policy by themselves.</text></g>
<g id="label-e1"><rect x="333.185" y="339" width="113.63" height="23" rx="5" fill="#FFFFFF" stroke="#CAD8E8" stroke-width="0.7"/><text x="390" y="355" font-size="13" fill="#132B50" font-weight="500" text-anchor="middle">Untrusted input</text></g>
<g id="label-e2"><rect x="746.125" y="339" width="116.75" height="23" rx="5" fill="#FFFFFF" stroke="#CAD8E8" stroke-width="0.7"/><text x="804.5" y="355" font-size="13" fill="#132B50" font-weight="500" text-anchor="middle">Request context</text></g>
<g id="label-e3"><rect x="1122.3" y="339" width="127.41" height="23" rx="5" fill="#FFFFFF" stroke="#CAD8E8" stroke-width="0.7"/><text x="1186" y="355" font-size="13" fill="#132B50" font-weight="500" text-anchor="middle">Authorized access</text></g>
<text x="36" y="701" font-size="11" fill="#5B708B" font-weight="400" text-anchor="start">Illustrative architecture. Labels describe roles; generic symbols do not assert product compatibility.</text>
</svg>
